<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telescope Simulator — feasibility check</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 900px; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
  img { max-width: 100%; border: 1px solid #ddd; margin: 4px 0; }
</style>
</head>
<body>
<h1>Telescope Simulator (browser feasibility check)</h1>
<p>Development check (not part of the public export): runs tutorial
scenarios from the desktop code in a background worker.</p>
<pre id="log">Starting…</pre>
<div id="figures"></div>
<script type="module">
  // All paths are relative so the app works under any base path,
  // e.g. /apps/telescope-simulation/.
  const log = document.getElementById("log");
  const say = (line) => { log.textContent += "\n" + line; };
  const worker = new Worker("./assets/worker.js", { type: "module" });
  const t0 = performance.now();
  worker.onmessage = ({ data }) => {
    if (data.type === "log") say(data.text);
    if (data.type === "figure") {
      const img = new Image();
      img.alt = data.title;
      img.src = URL.createObjectURL(new Blob([data.png], { type: "image/png" }));
      document.getElementById("figures").append(img);
    }
    if (data.type === "done" || data.type === "error") {
      say(data.text + ` (page total ${((performance.now() - t0) / 1000).toFixed(1)} s)`);
      document.documentElement.dataset.status = data.type === "done" ? "ready" : "error";
      document.title = (data.type === "done" ? "DONE " : "ERROR ") + data.text;
    }
  };
  worker.postMessage({ scenarios: [0, 1, 16, 17] });
</script>
</body>
</html>
